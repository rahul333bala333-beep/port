[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback for client-side routing. Netlify serves real files and
# /.netlify/functions/* before this catch-all, so the API still works.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
